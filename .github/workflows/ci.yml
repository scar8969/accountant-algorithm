name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Migrations apply to a fresh database
        env:
          ACCOUNTANT_DB_URL: sqlite:///ci.db
        run: |
          python -m alembic upgrade head
          python -m alembic current
      - name: Benchmark smoke run
        run: python scripts/run_benchmark.py --profiles 40 --no-write
